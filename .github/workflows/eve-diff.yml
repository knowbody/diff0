# Paid comparison of the maintenance agent; demo changes have their own workflow.
name: diff0 maintenance agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/eve-diff.yml"
      - "scripts/maintenance-relevance.mjs"
      - "agent/agent.ts"
      - "agent/instructions.*"
      - "agent/sandbox.ts"
      - "agent/tools/**"
      - "agent/hooks/**"
      - "agent/channels/**"
      - "agent/connections/**"
      - "agent/extensions/**"
      - "agent/lib/**"
      - "agent/subagents/**"
      - "agent/skills/**"
      - "agent/tsconfig.json"
      - "evals/smoke.eval.ts"
      - "evals/routing/needs-clarification.eval.ts"
      - "evals/safety/prompt-injection.eval.ts"
      - "evals/safety/write-requires-approval.eval.ts"
      - "evals/evals.config.ts"
      - "evals/helpers.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "yarn.lock"
      - "bun.lock"
      - "bun.lockb"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".yarnrc.yml"
      - "tsconfig.json"

concurrency:
  group: eve-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  maintenance-agent:
    # Keep the same credential boundary as the fixture job. Bot-authored PRs
    # need a maintainer-reviewed branch before they can receive model secrets.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      !contains(github.event.pull_request.labels.*.name, 'skip-paid-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check maintenance-agent relevance
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/maintenance-relevance.mjs

      - name: Compare diff0 Eve
        if: steps.relevance.outputs.relevant == 'true'
        uses: ./action
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.DIFF0_AI_GATEWAY_API_KEY }}
          FACTORY_EVAL_SANDBOX: justbash
        with:
          working-directory: .
          # Explicit IDs keep connector-backed and mutating evals out of CI.
          # These exercise the authored root, classifier, and safety behavior.
          evals: smoke,routing/needs-clarification,safety/prompt-injection,safety/write-requires-approval
          runs: "3"
          max-spend: "3.00"
          comment-key: maintenance-agent
          fail-on: regression
