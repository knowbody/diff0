name: Compare reviewed Eve PR

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Same-repository PR number"
        required: true
        type: string
      reviewed_sha:
        description: "Full head SHA reviewed and approved for execution with model credentials"
        required: true
        type: string

concurrency:
  group: eve-reviewed-diff-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    # Dispatch and reruns require the owner, using the workflow on the default branch.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify reviewed commit
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: node scripts/validate-reviewed-pr.mjs

      - name: Compare the reviewed agent
        id: compare
        continue-on-error: true
        uses: ./action
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.DIFF0_AI_GATEWAY_API_KEY }}
          FACTORY_EVAL_SANDBOX: justbash
        with:
          base: ${{ steps.refs.outputs.base-sha }}
          head: ${{ steps.refs.outputs.head-sha }}
          working-directory: .
          evals: smoke,routing/needs-clarification,safety/prompt-injection,safety/write-requires-approval
          runs: "3"
          max-spend: "3.00"
          fail-on: regression

      - name: Recheck the PR and publish its report
        if: ${{ !cancelled() && steps.compare.outputs.exit-code != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPECTED_BASE_SHA: ${{ steps.refs.outputs.base-sha }}
          BASE_REF: ${{ steps.refs.outputs.base-sha }}
          HEAD_REF: ${{ steps.refs.outputs.head-sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head-sha }}
          REPORT_PATH: ${{ steps.compare.outputs.report-md }}
          CLI_EXIT: ${{ steps.compare.outputs.exit-code }}
          COMMENT_KEY: reviewed-maintenance-agent
        run: |
          node scripts/validate-reviewed-pr.mjs
          node action/upsert-comment.mjs

      - name: Preserve comparison failure
        if: ${{ !cancelled() && steps.compare.outcome == 'failure' }}
        run: exit 1
