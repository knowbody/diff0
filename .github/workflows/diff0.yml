# Dogfood workflow: run diff0 on its own fixture agent.
#
# Relevant pull requests behaviorally diff fixtures/demo-agent between the PR
# base and head with a real model, then upsert the sticky report comment.
name: diff0

on:
  pull_request:
    paths:
      - ".github/workflows/diff0.yml"
      - "action/**"
      - "fixtures/demo-agent/**"
      - "scripts/build-action.mjs"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "prices.json"
      - "tsconfig*.json"

concurrency:
  group: diff0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diff0:
    # The Action exposes a paid-model credential while executing application
    # and eval code from both refs. Only owner-authored, owner-triggered branches
    # inside this repository cross that trust boundary. Fork and collaborator
    # PRs remain covered by ordinary CI without receiving the credential.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.DIFF0_AI_GATEWAY_API_KEY }}
      DIFF0_DEMO_MODEL: anthropic/claude-haiku-4.5
    steps:
      # fetch-depth: 0 is REQUIRED — diff0 checks the PR base ref out into
      # an isolated worktree, and a shallow clone would not contain it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Head-controlled eval code must not be able to recover the job token
          # from the checkout's persisted Git authentication config.
          persist-credentials: false

      # Node >= 24: the fixture demo-agent's engines field requires it
      # (the diff0 CLI itself only needs >= 20).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ./action
        with:
          working-directory: fixtures/demo-agent
          # Ten runs per ref make the public evidence robust to model variance.
          runs: "10"
          max-spend: "0.30"
          fail-on: regression
