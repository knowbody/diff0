# diff0 composite action
#
# REQUIREMENTS — the calling workflow MUST do these BEFORE `uses:`-ing this action:
#   1. actions/checkout with `fetch-depth: 0` and `persist-credentials: false`.
#      diff0 checks the base ref out into an isolated worktree, and evaluated
#      head code must not inherit checkout's persisted GitHub token.
#   2. actions/setup-node with Node 24 for current Eve releases. The diff0 CLI and action scripts
#      themselves support Node >= 20, but the target app must satisfy its Eve engine requirement.
#
# Zero third-party action dependencies: composite `run` steps only.

name: "diff0"
description: "Catch your agent's drift. git diff tells you what changed in the code; diff0 tells you what changed in the agent."

inputs:
  base:
    description: "Base git ref to compare against. Defaults to the PR base SHA; required on non-PR events."
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: "Head git ref. Defaults to the PR head SHA (the CLI falls back to HEAD when empty)."
    default: ${{ github.event.pull_request.head.sha }}
  runs:
    description: "Eval-suite executions per ref."
    default: "3"
  evals:
    description: "Eval id/prefix filter (comma-separated). Empty runs all evals."
    default: ""
  validity-paths:
    description: "Additional repo-relative evaluator/config globs (comma-separated). Changes matching these paths make comparison validity fail."
    default: ""
  fail-on:
    description: "Legacy regression | drift | never, or comma-separated granular categories: eval-regression, score-regression, performance-regression, behavioral-drift, comparison-validity."
    default: "regression"
  max-spend:
    description: "Measured-cost USD stop threshold. Checked after each atomic suite run, so it can overshoot by one run; unavailable cost cannot be enforced. Empty disables it."
    default: ""
  max-cost-increase-pct:
    description: "Maximum median cost increase percentage. Empty uses the core default (25)."
    default: ""
  max-input-token-increase-pct:
    description: "Maximum median uncached-input-token increase percentage. Empty uses the core default (100)."
    default: ""
  max-output-token-increase-pct:
    description: "Maximum median output-token increase percentage. Empty uses the core default (100)."
    default: ""
  max-duration-increase-pct:
    description: "Maximum median duration increase percentage. Empty uses the core default (100)."
    default: ""
  working-directory:
    description: "Path of the eve app within the repo (maps to CLI --app-dir; the repo root is always the workflow checkout)."
    default: "."
  install-mode:
    description: "Dependency install policy: scripts-off disables lifecycle/build scripts (default); scripts-on enables them. Legacy safe/trusted aliases are deprecated. Neither mode is a sandbox."
    default: "scripts-off"
  github-token:
    description: "Token used to upsert the sticky PR comment (needs pull-requests: write)."
    default: ${{ github.token }}
  comment-key:
    description: "Optional stable key for multiple independent sticky reports on the same PR."
    default: ""
  allow-untrusted-head:
    description: "Allow fork PR head code to install and execute. Unsafe with secrets; defaults to false."
    default: "false"

outputs:
  verdict:
    description: "Report verdict: green | yellow | red. Empty when the CLI failed before producing a report."
    value: ${{ steps.enforce.outputs.verdict }}
  exit-code:
    description: "Raw diff0 CLI exit code (the CLI itself runs with --fail-on never)."
    value: ${{ steps.run.outputs.exit-code }}
  report-md:
    description: "Path to the markdown report."
    value: ${{ steps.run.outputs.report-md }}
  report-json:
    description: "Path to the JSON report."
    value: ${{ steps.run.outputs.report-json }}

runs:
  using: "composite"
  steps:
    - name: Enforce the PR trust boundary
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        ALLOW_UNTRUSTED_HEAD: ${{ inputs.allow-untrusted-head }}
        COMMENT_KEY: ${{ inputs.comment-key }}
      run: |
        case "$ALLOW_UNTRUSTED_HEAD" in
          true|false) ;;
          *)
            echo "::error::diff0: invalid allow-untrusted-head input '$ALLOW_UNTRUSTED_HEAD' (expected true | false)."
            exit 2
            ;;
        esac
        if [ -n "$COMMENT_KEY" ] && ! [[ "$COMMENT_KEY" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
          echo "::error::diff0: invalid comment-key '$COMMENT_KEY' (use 1-64 letters, numbers, dots, underscores, or hyphens)."
          exit 2
        fi
        if git -C "$GITHUB_WORKSPACE" config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
          echo "::error::diff0: checkout credentials are persisted in the repository Git config. Head eval code could read that token. Set 'persist-credentials: false' on actions/checkout before running diff0."
          exit 2
        fi
        # checkout@v7 stores auth in a runner-temp credential config and adds
        # local includeIf.*.path pointers instead of the older extraheader.
        if git -C "$GITHUB_WORKSPACE" config --local --get-regexp '^includeIf\.gitdir:.*\.path$' 2>/dev/null | grep -Eq 'git-credentials-.*\.config'; then
          echo "::error::diff0: checkout credentials are persisted through a Git includeIf credential config. Head eval code could read that token. Set 'persist-credentials: false' on actions/checkout before running diff0."
          exit 2
        fi
        if [ "$EVENT_NAME" = "pull_request_target" ] && [ "$ALLOW_UNTRUSTED_HEAD" != "true" ]; then
          echo "::error::diff0: refusing pull_request_target by default. Head eval, tool, and runtime code would execute in a privileged context. Use pull_request, or explicitly set allow-untrusted-head: true only in an isolated secret-free job."
          exit 2
        fi
        if [ "$IS_FORK_PR" = "true" ] && [ "$ALLOW_UNTRUSTED_HEAD" != "true" ]; then
          echo "::error::diff0: fork PR refused. diff0 installs dependencies and executes code from the head ref. To opt in, use an isolated secret-free job and set allow-untrusted-head: true."
          exit 2
        fi

    - name: Enable Corepack package managers
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: corepack enable

    - name: Run diff0
      id: run
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_RUNS: ${{ inputs.runs }}
        INPUT_EVALS: ${{ inputs.evals }}
        INPUT_VALIDITY_PATHS: ${{ inputs.validity-paths }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MAX_SPEND: ${{ inputs.max-spend }}
        INPUT_MAX_COST_INCREASE_PCT: ${{ inputs.max-cost-increase-pct }}
        INPUT_MAX_INPUT_TOKEN_INCREASE_PCT: ${{ inputs.max-input-token-increase-pct }}
        INPUT_MAX_OUTPUT_TOKEN_INCREASE_PCT: ${{ inputs.max-output-token-increase-pct }}
        INPUT_MAX_DURATION_INCREASE_PCT: ${{ inputs.max-duration-increase-pct }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_INSTALL_MODE: ${{ inputs.install-mode }}
      run: |
        # Validate cheap things up front, before any eval spend.
        if ! node <<'NODE'
        const legacy = new Set(["regression", "drift", "never"]);
        const granular = new Set([
          "eval-regression",
          "score-regression",
          "performance-regression",
          "behavioral-drift",
          "comparison-validity",
        ]);
        const raw = process.env.INPUT_FAIL_ON ?? "";
        const tokens = raw.split(",").map((token) => token.trim());
        const fail = (message) => {
          console.log(`::error::diff0: invalid fail-on input '${raw}' (${message}).`);
          process.exit(2);
        };
        if (tokens.some((token) => token.length === 0)) fail("empty policy name");
        if (tokens.length === 1 && legacy.has(tokens[0])) {
          // Valid legacy policy.
        } else if (tokens.some((token) => legacy.has(token))) {
          fail("legacy and granular policies cannot be mixed");
        } else {
          const unknown = tokens.filter((token) => !granular.has(token));
          if (unknown.length > 0) fail(`unknown policy: ${unknown.join(", ")}`);
        }

        const percentages = [
          ["max-cost-increase-pct", process.env.INPUT_MAX_COST_INCREASE_PCT],
          ["max-input-token-increase-pct", process.env.INPUT_MAX_INPUT_TOKEN_INCREASE_PCT],
          ["max-output-token-increase-pct", process.env.INPUT_MAX_OUTPUT_TOKEN_INCREASE_PCT],
          ["max-duration-increase-pct", process.env.INPUT_MAX_DURATION_INCREASE_PCT],
        ];
        const decimal = /^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i;
        for (const [name, rawValue] of percentages) {
          if (rawValue === undefined || rawValue === "") continue;
          const value = Number(rawValue);
          if (!decimal.test(rawValue.trim()) || !Number.isFinite(value) || value < 0) {
            console.log(`::error::diff0: invalid ${name} input '${rawValue}' (expected a finite non-negative percentage).`);
            process.exit(2);
          }
        }
        NODE
        then
          exit 2
        fi
        case "$INPUT_INSTALL_MODE" in
          scripts-off|scripts-on) ;;
          safe)
            echo "::warning::diff0: install-mode 'safe' is deprecated; use 'scripts-off'."
            INPUT_INSTALL_MODE="scripts-off"
            ;;
          trusted)
            echo "::warning::diff0: install-mode 'trusted' is deprecated; use 'scripts-on'."
            INPUT_INSTALL_MODE="scripts-on"
            ;;
          *)
            echo "::error::diff0: invalid install-mode input '$INPUT_INSTALL_MODE' (expected scripts-off | scripts-on)."
            exit 2
            ;;
        esac
        if [ "$INPUT_INSTALL_MODE" = "scripts-on" ]; then
          echo "::warning::diff0: scripts-on mode executes lifecycle/build scripts from both compared refs. Neither install mode is a sandbox; use this only for reviewed refs. Package-registry auth remains available to the installer and scripts."
        fi
        if [ -z "$INPUT_BASE" ]; then
          echo "::error::diff0: the 'base' input is empty. It defaults to the pull request base SHA, so on non-pull_request events you must pass 'base' explicitly."
          exit 2
        fi

        report_dir="$(mktemp -d "$RUNNER_TEMP/diff0.XXXXXX")"
        report_md="$report_dir/report.md"
        report_json="$report_dir/report.json"

        args=(run
          --repo "$GITHUB_WORKSPACE"
          --app-dir "$INPUT_WORKING_DIRECTORY"
          --base "$INPUT_BASE"
          --runs "$INPUT_RUNS"
          --install-mode "$INPUT_INSTALL_MODE"
          --fail-on never
          --report-md "$report_md"
          --report-json "$report_json"
        )
        # --head defaults to HEAD inside the CLI; only pass it when we have one.
        if [ -n "$INPUT_HEAD" ]; then args+=(--head "$INPUT_HEAD"); fi
        if [ -n "$INPUT_EVALS" ]; then args+=(--evals "$INPUT_EVALS"); fi
        if [ -n "$INPUT_VALIDITY_PATHS" ]; then args+=(--validity-path "$INPUT_VALIDITY_PATHS"); fi
        if [ -n "$INPUT_MAX_SPEND" ]; then args+=(--max-spend "$INPUT_MAX_SPEND"); fi
        if [ -n "$INPUT_MAX_COST_INCREASE_PCT" ]; then args+=(--max-cost-increase-pct "$INPUT_MAX_COST_INCREASE_PCT"); fi
        if [ -n "$INPUT_MAX_INPUT_TOKEN_INCREASE_PCT" ]; then args+=(--max-input-token-increase-pct "$INPUT_MAX_INPUT_TOKEN_INCREASE_PCT"); fi
        if [ -n "$INPUT_MAX_OUTPUT_TOKEN_INCREASE_PCT" ]; then args+=(--max-output-token-increase-pct "$INPUT_MAX_OUTPUT_TOKEN_INCREASE_PCT"); fi
        if [ -n "$INPUT_MAX_DURATION_INCREASE_PCT" ]; then args+=(--max-duration-increase-pct "$INPUT_MAX_DURATION_INCREASE_PCT"); fi

        # The CLI always runs with --fail-on never so the report (and the PR
        # comment in the next step) is produced before any failure. The fail-on
        # INPUT is enforced in the final step from the JSON verdict and typed
        # enforcement categories.
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.mjs" "${args[@]}"
        code=$?
        set -e

        echo "diff0 CLI exited with code $code"
        {
          echo "exit-code=$code"
          echo "report-md=$report_md"
          echo "report-json=$report_json"
        } >> "$GITHUB_OUTPUT"

    - name: Upsert sticky PR comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_PATH: ${{ steps.run.outputs.report-md }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        CLI_EXIT: ${{ steps.run.outputs.exit-code }}
        BASE_REF: ${{ inputs.base }}
        HEAD_REF: ${{ inputs.head }}
        HEAD_SHA: ${{ github.sha }}
      run: node "$GITHUB_ACTION_PATH/upsert-comment.mjs"

    - name: Enforce fail-on policy
      id: enforce
      shell: bash
      env:
        CLI_EXIT: ${{ steps.run.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
        REPORT_JSON: ${{ steps.run.outputs.report-json }}
      run: |
        # Execution/config errors always fail, regardless of the fail-on policy.
        case "$CLI_EXIT" in
          0) ;;
          2)
            echo "::error::diff0: configuration error (exit 2) — see the CLI output above for the exact message."
            exit 2
            ;;
          3)
            echo "::error::diff0: execution error (exit 3) — an eval run or install crashed. See the CLI output above."
            exit 3
            ;;
          4)
            echo "::error::diff0: aborted — the --max-spend cap was exceeded (exit 4). See the CLI output above."
            exit 4
            ;;
          *)
            # The CLI ran with --fail-on never, so exit 1 (or anything else) is unexpected here.
            echo "::error::diff0: CLI exited with unexpected code $CLI_EXIT."
            exit "$CLI_EXIT"
            ;;
        esac

        if [ ! -f "$REPORT_JSON" ]; then
          echo "::error::diff0: CLI exited 0 but no JSON report was found at $REPORT_JSON."
          exit 3
        fi

        if ! report_state="$(node -e '
          const report = JSON.parse(require("node:fs").readFileSync(process.env.REPORT_JSON, "utf8"));
          const categories = new Set([
            "eval-regression", "score-regression", "performance-regression",
            "behavioral-drift", "comparison-validity",
          ]);
          const violations = report.enforcement?.violations;
          if (
            report.schemaVersion !== 4 ||
            !["green", "yellow", "red"].includes(report.verdict) ||
            !Array.isArray(violations) ||
            !violations.every((violation) =>
              violation && categories.has(violation.category) &&
              Array.isArray(violation.reasons) &&
              violation.reasons.every((reason) => typeof reason === "string")
            )
          ) {
            process.exit(3);
          }
          process.stdout.write(`${report.verdict}|${violations.map((item) => item.category).join(",")}`);
        ')"; then
          echo "::error::diff0: JSON report has an unsupported schema or invalid verdict/enforcement data."
          exit 3
        fi
        verdict="${report_state%%|*}"
        violation_categories="${report_state#*|}"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

        # Preflight accepts surrounding whitespace by trimming policy tokens;
        # enforce the same normalized value here.
        FAIL_ON="${FAIL_ON//[[:space:]]/}"

        case "$FAIL_ON" in
          regression)
            if [ "$verdict" = "red" ]; then
              echo "::error::diff0: eval regression detected (verdict: red, fail-on: regression). The full report is in the PR comment."
              exit 1
            fi
            ;;
          drift)
            if [ "$verdict" = "red" ] || [ "$verdict" = "yellow" ]; then
              echo "::error::diff0: verdict is $verdict (fail-on: drift). The full report is in the PR comment."
              exit 1
            fi
            ;;
          never) ;;
          *)
            IFS=',' read -r -a selected_categories <<< "$FAIL_ON"
            for selected in "${selected_categories[@]}"; do
              selected="${selected//[[:space:]]/}"
              if [[ ",$violation_categories," == *",$selected,"* ]]; then
                echo "::error::diff0: enforcement category '$selected' was violated (fail-on: $FAIL_ON). The full report is in the PR comment."
                exit 1
              fi
            done
            ;;
        esac
        echo "diff0 verdict: $verdict (fail-on: $FAIL_ON) — check passed."
